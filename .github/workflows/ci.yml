name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax check
        run: |
          python -c "import synmich; import synmich.cli; import synmich.core.synology; import synmich.core.immich; import synmich.core.migrator; import synmich.core.checkpoint; import synmich.ui.theme; import synmich.ui.wizard; import synmich.ui.dashboard"

      - name: Unit tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          synmich --version
          synmich --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          for attempt in 1 2 3; do
            if docker build -t synmich:test -f docker/Dockerfile .; then
              exit 0
            fi
            echo "Docker Hub pull/build failed (attempt ${attempt}/3)"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Test container help
        run: docker run --rm synmich:test --version
