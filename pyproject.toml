[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synmich"
version = "2.3.2"
description = "Synology Photos → Immich migration & local backup, with a GUI and shared-album support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Jeffrey Schnyder" },
]
keywords = [
    "synology",
    "immich",
    "photos",
    "migration",
    "self-hosted",
    "backup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "requests>=2.31",
    "requests-toolbelt>=1.0",
    "urllib3>=2.0",
    "PyYAML>=6.0",
    "rich>=13.7",
    "textual>=0.50",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.2",
    "Pillow>=10",
]
dev = [
    "ruff>=0.1",
    "pytest>=7",
    "pytest-cov>=4",
]

[project.scripts]
synmich = "synmich.cli:main"

[project.urls]
Homepage = "https://github.com/t3ksin/synmich"
Repository = "https://github.com/t3ksin/synmich"
Issues = "https://github.com/t3ksin/synmich/issues"

[tool.setuptools.packages.find]
include = ["synmich*"]

[tool.setuptools.package-data]
"synmich.gui" = ["assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
